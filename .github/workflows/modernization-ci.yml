name: Remix Modernization CI

on:
  push:
    branches:
      - retool/real-time-remix
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Backend syntax check
        working-directory: backend
        run: |
          npm ci
          node --check index.js
          node --check controllers/AudioController.js
          node --check routes/audioRoutes.js
